<div class="filters" [attr.aria-label]="'Filters.Region' | translate">
  <cedar-filter-chip
    [text]="typeLabel"
    [label]="'Common.Type' | translate"
    [controls]="id + '-type'"
    [active]="value().types.length > 0"
    [expanded]="open() === 'type'"
    (toggle)="toggle('type')"
    (clear)="clear('type')"
  />
  <cedar-filter-chip
    [text]="dateLabel"
    [label]="'Common.LastModified' | translate"
    [controls]="id + '-date'"
    [active]="!!value().modified"
    [expanded]="open() === 'date'"
    (toggle)="toggle('date')"
    (clear)="clear('date')"
  />
  <label class="version-filter">
    <span class="version-choice">
      <span class="version-choice-label" aria-hidden="true"
        >{{(version() === 'latest' ? 'Common.LatestVersion' :
        'Common.AllVersions') | translate}}</span
      >
      <select
        [attr.aria-label]="'Common.Version' | translate"
        [ngModel]="version()"
        (ngModelChange)="versionChange.emit($event)"
      >
        <option value="latest">{{'Common.LatestVersion' | translate}}</option>
        <option value="all">{{'Common.AllVersions' | translate}}</option>
      </select>
      <cedar-icon name="chevron-down" size="small" />
    </span>
  </label>
  @if(value().types.length || value().modified) {
  <button type="button" (click)="clear()">
    {{'Filters.ClearFilters' | translate}}
  </button>
  }
</div>
@if(open()) {
<section
  class="popover"
  [class.date]="open() === 'date'"
  role="dialog"
  [attr.id]="id + (open() === 'type' ? '-type' : '-date')"
  [attr.aria-label]="(open() === 'type' ? 'Filters.ByType' : 'Filters.ByLastModified') | translate"
>
  @if(open() === 'type') {
  <div class="type-options">
    @for(type of types; track type.value) {
    <label
      ><input
        type="checkbox"
        spellcheck="false"
        [checked]="draft().types.includes(type.value)"
        (change)="selectType(type.value)"
      />
      <cedar-icon
        [name]="type.value === 'folder' ? 'folder' : 'artifact-' + type.value"
      />
      {{type.label | translate}}</label
    >
    }
  </div>
  } @else {
  <div class="date-body">
    <div
      class="presets"
      role="group"
      [attr.aria-label]="'Filters.DatePresets' | translate"
    >
      @for(p of presets; track p.value) {
      <button
        type="button"
        [class.selected]="draft().modified === p.value"
        [attr.aria-pressed]="draft().modified === p.value"
        (click)="preset(p.value)"
      >
        <span class="check"
          >@if(draft().modified === p.value){<cedar-icon name="check" />}</span
        >{{p.label}}
      </button>
      }
    </div>
    <div class="range">
      <label
        >{{'Filters.After' | translate}}<input
          type="date"
          spellcheck="false"
          [attr.aria-label]="'Filters.After' | translate"
          [ngModel]="draft().after || ''"
          (ngModelChange)="editDate('after', $event)"
      /></label>
      <label
        >{{'Filters.Before' | translate}}<input
          type="date"
          spellcheck="false"
          [attr.aria-label]="'Filters.Before' | translate"
          [ngModel]="draft().before || ''"
          (ngModelChange)="editDate('before', $event)"
          [attr.aria-invalid]="rangeError ? true : null"
          [attr.aria-describedby]="rangeError ? id + '-error' : null"
      /></label>
      @if(rangeError){
      <p class="error" [id]="id + '-error'" role="alert">{{rangeError}}</p>
      }
      <p class="hint">{{'Filters.Hint' | translate}}</p>
    </div>
  </div>
  }
  <footer>
    <button type="button" (click)="clearDraft()">
      {{'Filters.ClearAll' | translate}}</button
    ><span></span
    ><button type="button" (click)="close()">
      {{'Common.Cancel' | translate}}</button
    ><button
      type="button"
      class="primary"
      [disabled]="!!rangeError && open() === 'date'"
      (click)="apply()"
    >
      {{'Filters.Apply' | translate}}
    </button>
  </footer>
</section>
}
