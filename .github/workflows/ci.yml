name: Build and package

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  adoption:
    uses: metadatacenter/cedar-design-tokens/.github/workflows/adoption.yml@develop

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Workspace
        uses: actions/checkout@v7

      - name: Use Node 24.22.1
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Lint the component templates
        run: npm run lint

      - name: Build the Angular workspace
        run: npm run build

      - name: Share the production build with all browser engines
        uses: actions/upload-artifact@v7
        with:
          name: workspace-browser-build
          path: |
            .workspace-build
            app/workspace-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      - name: Prove the train package can be assembled
        run: npm pack --dry-run

      - name: Build the deployment payload
        env:
          CEDAR_FRONTEND_BEHAVIOR: server
          CEDAR_FRONTEND_TARGET: ci
          CEDAR_FRONTEND_ci_UI_HOST: metadatacenter.example
          CEDAR_FRONTEND_ci_REST_HOST: metadatacenter.example
          CEDAR_WORKSPACE_FRONTEND_URL: https://workspace.metadatacenter.example
          CEDAR_TEMPLATE_DESIGNER_FRONTEND_URL: https://designer.metadatacenter.example
          CEDAR_VERSION: 0.0.0-ci
          CEDAR_VERSION_MODIFIER: ''
          CEDAR_DATACITE_ENABLED: 'false'
          CEDAR_GA4_TRACKING_ID: ''
        run: npm run build:deployment

      - name: Run Angular, authentication and packaging suites
        run: npm test

  browser:
    name: Browser contracts (${{ matrix.browser }})
    env:
      # Match the existing hosted allocation even when local CI sees more CPU cores.
      CEDAR_TEST_WORKERS: '2'
    needs: package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve the unnamed Chromium project's existing screenshot paths.
          - browser: chromium
            project: ''
          - browser: firefox
            project: firefox
          - browser: webkit
            project: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: workspace-browser-build
          path: .
      - name: Visual, keyboard and accessibility contracts
        run: npm run test:visual -- --project="${{ matrix.project }}" --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-${{ matrix.browser }}-diagnostics
          path: browser/test-results/
